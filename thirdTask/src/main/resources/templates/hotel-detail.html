<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Детали отеля</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <div class="row">
        <div class="col-md-12">
            <a href="/" class="btn btn-secondary mb-3">← Назад к списку</a>
        </div>
    </div>

    <div class="card">
        <div class="card-header">
            <h3>Информация об отеле</h3>
        </div>
        <div class="card-body">
            <form id="hotelForm">
                <div class="mb-3">
                    <label for="hotelId" class="form-label">ID отеля</label>
                    <input type="text" class="form-control" id="hotelId" th:value="${hotel.id}" readonly>
                </div>

                <div class="mb-3">
                    <label for="hotelName" class="form-label">Название отеля</label>
                    <input type="text" class="form-control" id="hotelName" th:value="${hotel.name}" required>
                </div>

                <div class="mb-3">
                    <label for="hotelDescription" class="form-label">Описание</label>
                    <textarea class="form-control" id="hotelDescription" rows="4" th:text="${hotel.description}"></textarea>
                </div>

                <div class="mb-3">
                    <label for="hotelStars" class="form-label">Количество звезд</label>
                    <input type="number" class="form-control" id="hotelStars" th:value="${hotel.stars}" min="1" max="5">
                </div>

                <div class="mb-3">
                    <label class="form-label">Дата создания</label>
                    <input type="text" class="form-control" th:value="${hotel.createdAt}" readonly>
                </div>

                <div class="mb-3">
                    <label class="form-label">Дата обновления</label>
                    <input type="text" class="form-control" th:value="${hotel.updatedAt}" readonly>
                </div>

                <button type="button" onclick="updateHotel()" class="btn btn-primary">Сохранить изменения</button>
            </form>

            <div id="alertMessage" class="alert mt-3" role="alert" style="display: none;"></div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
<script th:inline="javascript">
    function updateHotel() {
        const hotelId = document.getElementById('hotelId').value;
        const hotelName = document.getElementById('hotelName').value;
        const hotelDescription = document.getElementById('hotelDescription').value;
        const hotelStars = parseInt(document.getElementById('hotelStars').value);

        const hotelData = {
            name: hotelName,
            description: hotelDescription,
            stars: hotelStars
        };

        fetch('/api/v1/hotel/' + hotelId, {
            method: 'PUT',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(hotelData)
        })
        .then(response => {
            if (response.ok) {
                return response.json();
            } else {
                throw new Error('Ошибка при обновлении отеля');
            }
        })
        .then(data => {
            showAlert('Данные отеля успешно обновлены!', 'success');
            setTimeout(() => {
                window.location.reload();
            }, 1500);
        })
        .catch(error => {
            showAlert('Ошибка: ' + error.message, 'danger');
        });
    }

    function showAlert(message, type) {
        const alertDiv = document.getElementById('alertMessage');
        alertDiv.className = 'alert alert-' + type + ' mt-3';
        alertDiv.textContent = message;
        alertDiv.style.display = 'block';
    }
</script>
</body>
</html>
