<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Ошибка</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card border-danger">
                <div class="card-header bg-danger text-white">
                    <h3>Произошла ошибка</h3>
                </div>
                <div class="card-body">
                    <div class="alert alert-danger" role="alert">
                        <h4 class="alert-heading">
                            <span th:text="${status}">Код ошибки</span> - 
                            <span th:text="${error}">Ошибка</span>
                        </h4>
                        <hr>
                        <p class="mb-0" th:text="${message}">Описание ошибки</p>
                    </div>

                    <div class="mt-3">
                        <p><strong>Время:</strong> <span th:text="${timestamp}"></span></p>
                        <p th:if="${path}"><strong>Путь:</strong> <span th:text="${path}"></span></p>
                    </div>

                    <div class="mt-4">
                        <a href="/" class="btn btn-primary">Вернуться на главную</a>
                        <button onclick="history.back()" class="btn btn-secondary">Назад</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
